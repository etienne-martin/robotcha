name: build-publish

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, reopened, edited, synchronize, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    if: ${{ github.event_name == 'push' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify dist is up to date
        run: |
          changed="$(git diff --name-only -- dist)"
          if [ -n "$changed" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the updated dist/."
            echo "$changed"
            exit 1
          fi

      - name: Publish
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: bash scripts/publish.sh
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
